# Two ways to run the same image.
#
# On a machine whose user is not id 1000, set these once first so files written
# into the mounted workspace come back owned by you. UID and GID themselves are
# readonly in bash and cannot be exported, hence the HOST_ prefix.
#
#   export HOST_UID=$(id -u) HOST_GID=$(id -g)
#
#   docker compose build
#   docker compose run --rm dev                  # a shell, no graphics
#   docker compose run --rm dev colcon test      # or a command directly
#   docker compose run --rm gui ros2 launch tattotronix_gazebo draw.launch.py
#
# `dev` is what CI uses and what the analysis scripts need: no display, no X
# socket, nothing to break on a headless machine. `gui` is the same image with
# the host's display handed in, for watching the simulation.
#
# They are separate services rather than one that tries both because a container
# that needs an X socket fails on a machine that has none, and CI is exactly
# that machine.

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: tattotronix:dev
    # The workspace is mounted, so edits on the host are what runs, and a
    # rebuild is `colcon build` rather than a docker build. build/ and install/
    # stay in the container: mixing host and container build trees breaks both.
    volumes:
      - .:/ws:rw
      - tattotronix-build:/ws/build
      - tattotronix-install:/ws/install
    working_dir: /ws
    stdin_open: true
    tty: true

  # Software rendering. Works anywhere, including a machine with no GPU
  # passed through, which is what a container gets by default: the host driver
  # is not inside it, so OpenGL falls back to llvmpipe. Fine for looking at the
  # arm, slow for a long drawing.
  gui:
    extends: dev
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
      # Gazebo's GUI and RViz both use OGRE; on a machine with no GPU passed
      # through, this is what stops them failing instead of falling back.
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-0}"
    volumes:
      - .:/ws:rw
      - tattotronix-build:/ws/build
      - tattotronix-install:/ws/install
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "${XAUTHORITY:-/dev/null}:/tmp/.docker.xauth:ro"
    network_mode: host

  # The same thing with the host GPU. Needs NVIDIA Container Toolkit installed
  # on the host; without it this service fails to start and `gui` is the one to
  # use. The difference is not cosmetic - software GL renders the studio world
  # at a few frames a second.
  #
  #   docker compose run --rm gui-nvidia ros2 launch tattotronix_gazebo draw.launch.py
  gui-nvidia:
    extends: gui
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      LIBGL_ALWAYS_SOFTWARE: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  tattotronix-build:
  tattotronix-install:
