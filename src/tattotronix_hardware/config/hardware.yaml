# What differs on the real arm, laid over
# tattotronix_control/config/tattotronix_controllers.yaml by arm.launch.py.
# Everything not named here - the controllers, their joints, their tolerances -
# is the simulation's, from the same file, so the two cannot drift apart.

controller_manager:
  ros__parameters:
    # A hobby servo samples its pulse once every 20 ms and closes its own loop,
    # so the 1 kHz the joint-loop studies need happens inside the servo, where
    # nothing here reaches. 100 Hz gives the trajectory controller two updates
    # per pulse frame and leaves a Raspberry Pi 3 time to spare. The driver
    # only puts a channel on the bus when its count changes.
    update_rate: 100
    # There is no simulator, so no /clock to follow.
    use_sim_time: false

    # The tool's motor, which only the real arm has: a speed from -1 to 1 on the
    # driver's tool interface, forwarded as it comes. The drawing node sets it.
    tool_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false
    # The tool's speed is an interface but not a joint. Naming the joints keeps
    # it out of /joint_states, which robot_state_publisher and MoveIt read as
    # the arm's joints.
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5]
    interfaces: [position, velocity]

tool_controller:
  ros__parameters:
    joints: [tool]
    interface_name: speed

arm_controller:
  ros__parameters:
    use_sim_time: false
