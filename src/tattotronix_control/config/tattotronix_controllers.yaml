# ros2_control controller manager configuration for the TATTOTRONIX arm.
#
# Read by the Gazebo Sim plugin in simulation and by ros2_control_node on
# hardware, so the controller set is identical in both. Anything that differs
# between the two belongs in the hardware interface, not here.

controller_manager:
  ros__parameters:
    # 1 kHz, and the rate is what sets the achievable bandwidth rather than the
    # other way round: the loop stays stable only while wn is a small fraction
    # of the sample rate, so a slower loop caps the bandwidth whatever the gains.
    # The sweep that shows it is docs/scripts/rate_study.py, and its numbers are
    # in docs/mathematical-model/control.md, section 7, where they are certified
    # against the data. They are deliberately not repeated here: a comment is
    # the one place nothing checks, and every number in this one depends on the
    # arm's mass model.
    #
    # Free in simulation. The real arm's hobby servos close their own loop, so
    # there the controller manager only chooses positions, at 100 Hz:
    # tattotronix_hardware/config/hardware.yaml lays that over this file.
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5

    # Position commands only. The description exposes no velocity or effort
    # command interface, and claiming one that does not exist makes the
    # controller fail to activate rather than degrade.
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    # A partial goal would leave the unnamed joints wherever they happen to
    # be. For an arm holding a needle that is never what the caller meant.
    allow_partial_joints_goal: false
    open_loop_control: false

    # Stated rather than inherited. The default is true in Humble and the
    # controller warns that it will become false, so leaving it unset means the
    # behaviour changes on an upgrade rather than on a decision. false is what
    # this arm wants: a drawing path ends with the needle stopped, and a
    # trajectory that is allowed to finish while still moving is a trajectory
    # whose last point is not where the tool ends up.
    allow_nonzero_velocity_at_trajectory_end: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint_1: {trajectory: 0.1, goal: 0.02}
      joint_2: {trajectory: 0.1, goal: 0.02}
      joint_3: {trajectory: 0.1, goal: 0.02}
      joint_4: {trajectory: 0.1, goal: 0.02}
      joint_5: {trajectory: 0.1, goal: 0.02}
