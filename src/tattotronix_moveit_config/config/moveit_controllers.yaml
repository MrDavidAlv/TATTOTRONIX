# How MoveIt hands a trajectory to the controller that already exists.
#
# The names and joints here must match tattotronix_control's controller YAML.
# They are not an independent configuration: if they drift, MoveIt plans for a
# controller that is not listening. tests/test_moveit_config.py compares the
# two files and fails on any difference.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
