# Style for everything outside the ROS packages.
#
# The packages under src/ are linted by ament through colcon test and take
# ament's own configuration. This covers docs/scripts, tools/ and tests/, which
# are not ROS packages and so are never reached by that.
#
# Every exception below is scoped to the files that need it and carries the
# reason. A blanket ignore would mean the check stops finding things.

[flake8]
max-line-length = 99
exclude =
    .git,
    build,
    install,
    log,
    __pycache__

# E501 is enforced everywhere. So is everything else not listed here.
per-file-ignores =
    # E402, module level import not at top: matplotlib has to be told to use a
    # non-interactive backend before pyplot is imported, and pyplot cannot be
    # imported first to satisfy the linter without breaking the thing the call
    # exists to prevent. The import order is the point.
    docs/scripts/figures.py:E402,E702
    docs/scripts/render_drawing.py:E402,E702
    # E741, ambiguous variable name: the name is I, and it is the inertia
    # tensor. Renaming it to satisfy a rule about l/I/O confusion would make the
    # code harder to read against the equations it implements, not easier.
    docs/scripts/dynamics.py:E741,E702
    # E702, multiple statements on one line: compact array and plotting
    # statements that belong together read better paired than stacked, for
    # example `ax.set_xticks([]); ax.set_yticks([])`. Deliberate, and confined
    # to the analysis scripts - nothing under src/ is allowed it.
    docs/scripts/rospath.py:E702
    docs/scripts/analysis.py:E702
